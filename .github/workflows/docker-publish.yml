name: Build and Push Container Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-pr-stage:
    name: Check PR Stage Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Only evaluate for non-PR events OR PRs originating from internal repository branches (never forks)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Verify Stage Tag for PR
        id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            echo "Checking tags for PR head commit: $HEAD_SHA"
            TAGS=$(git tag --points-at "$HEAD_SHA")
            echo "Tags pointing at commit $HEAD_SHA:"
            echo "$TAGS"
            if echo "$TAGS" | grep -E -q '^stage($|-|_|\.)'; then
              echo "PR commit has 'stage' tag. Proceeding with container build."
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "PR commit does NOT have a 'stage' tag. Container build skipped."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Event is ${{ github.event_name }}. Proceeding with container build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build & Push to Docker Hub
    needs: check-pr-stage
    if: needs.check-pr-stage.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      IS_MAIN_BUILD: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reserve date-based build version
        id: version
        if: env.IS_MAIN_BUILD == 'true'
        run: |
          # Version format: YYYYMMDDNN (UTC date + two-digit daily build number starting at 01).
          # The git tag is pushed before building so concurrent runs can never claim the same number.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE=$(date -u +%Y%m%d)
          for attempt in $(seq 1 5); do
            git fetch --tags --force --quiet origin
            LAST=$(git tag -l "${DATE}[0-9][0-9]" | sort | tail -n 1)
            if [ -z "$LAST" ]; then
              NEXT=1
            else
              NEXT=$((10#${LAST:8:2} + 1))
            fi
            if [ "$NEXT" -gt 99 ]; then
              echo "::error::Daily build limit (99) reached for ${DATE}"
              exit 1
            fi
            VERSION=$(printf '%s%02d' "$DATE" "$NEXT")
            git tag -a "$VERSION" -m "Build $VERSION" "$GITHUB_SHA"
            if git push origin "refs/tags/$VERSION"; then
              echo "Reserved build version $VERSION"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tag $VERSION already taken, retrying..."
            git tag -d "$VERSION"
          done
          echo "::error::Could not reserve a build version after 5 attempts"
          exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/moosemouse/birdbuddy-downloader
          tags: |
            type=raw,value=latest,enable=${{ env.IS_MAIN_BUILD == 'true' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=raw,value=pr-${{ github.head_ref }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
