name: Build and Push Container Image

# Published tags:
#   v*.*.* git tag on a commit in main -> :X.Y.Z, :X.Y and :latest (no :latest for pre-releases)
#   dev git tag (moving)               -> :dev
#   PR with a `stage` tag on its head  -> :pr-<branch>, :pr-<number>
#   manual run on a branch             -> :sha-<short sha>
# Pushes to main build nothing; :latest and version tags come only from releases.
on:
  push:
    tags:
      - 'v*.*.*'
      # Moving `dev` tag: builds the tagged commit as :dev only (no :latest, no version tag)
      - 'dev'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-pr-stage:
    name: Check PR Stage Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Only evaluate for non-PR events OR PRs originating from internal repository branches (never forks)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      is_release: ${{ steps.check.outputs.is_release }}

    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Verify Stage Tag for PR / Release Tag on main
        id: check
        run: |
          IS_RELEASE=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            echo "Checking tags for PR head commit: $HEAD_SHA"
            TAGS=$(git tag --points-at "$HEAD_SHA")
            echo "Tags pointing at commit $HEAD_SHA:"
            echo "$TAGS"
            if echo "$TAGS" | grep -E -q '^stage($|-|_|\.)'; then
              echo "PR commit has 'stage' tag. Proceeding with container build."
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "PR commit does NOT have a 'stage' tag. Container build skipped."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Releases (:latest and version tags) only come from commits already merged to main.
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Release tag ${GITHUB_REF#refs/tags/} is on main. Proceeding with release build."
              IS_RELEASE=true
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Release tag ${GITHUB_REF#refs/tags/} points at $GITHUB_SHA, which is not on main. Nothing was published."
              exit 1
            fi
          else
            echo "Event is ${{ github.event_name }} on $GITHUB_REF. Proceeding with container build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & Push to Docker Hub
    needs: check-pr-stage
    if: needs.check-pr-stage.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IS_RELEASE: ${{ needs.check-pr-stage.outputs.is_release }}
      IS_DEV_BUILD: ${{ github.event_name == 'push' && github.ref == 'refs/tags/dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/moosemouse/birdbuddy-downloader
          # :latest is only ever set by the explicit release rule below.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ env.IS_RELEASE == 'true' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ env.IS_RELEASE == 'true' }}
            type=raw,value=latest,enable=${{ env.IS_RELEASE == 'true' && !contains(github.ref_name, '-') }}
            type=raw,value=dev,enable=${{ env.IS_DEV_BUILD == 'true' }}
            type=raw,value=pr-${{ github.head_ref }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
