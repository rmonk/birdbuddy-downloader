name: Build and Push Container Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-pr-stage:
    name: Check PR Stage Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Only evaluate for non-PR events OR PRs originating from internal repository branches (never forks)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Verify Stage Tag for PR
        id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            echo "Checking tags for PR head commit: $HEAD_SHA"
            TAGS=$(git tag --points-at "$HEAD_SHA")
            echo "Tags pointing at commit $HEAD_SHA:"
            echo "$TAGS"
            if echo "$TAGS" | grep -E -q '^stage($|-|_|\.)'; then
              echo "PR commit has 'stage' tag. Proceeding with container build."
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "PR commit does NOT have a 'stage' tag. Container build skipped."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Event is ${{ github.event_name }}. Proceeding with container build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build & Push to Docker Hub
    needs: check-pr-stage
    if: needs.check-pr-stage.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/moosemouse/birdbuddy-downloader
          tags: |
            type=raw,value=latest,enable=${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
            type=raw,value=pr-${{ github.head_ref }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
