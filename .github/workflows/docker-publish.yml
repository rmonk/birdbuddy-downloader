name: Build and Push Container Image

# Published tags (both git tags are moving tags and must point at a commit on main):
#   release -> :latest and :YYYYMMDDNN (+ git tag YYYYMMDDNN)
#   dev     -> :dev
# Nothing else publishes an image. Each platform builds natively on its own runner
# and the per-platform images are combined into one multi-arch manifest.
on:
  push:
    tags:
      - 'release'
      - 'dev'
  # Manual re-runs are only accepted on the release or dev tag.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release mid-run: its YYYYMMDDNN git tag may already be pushed.
  cancel-in-progress: ${{ github.ref != 'refs/tags/release' }}

env:
  REGISTRY_IMAGE: docker.io/moosemouse/birdbuddy-downloader

jobs:
  check-tag:
    name: Check Tag Is on main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      is_release: ${{ steps.check.outputs.is_release }}

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release/dev tag points at main
        id: check
        run: |
          case "$GITHUB_REF" in
            refs/tags/release) IS_RELEASE=true ;;
            refs/tags/dev) IS_RELEASE=false ;;
            *)
              echo "::error::Images are only built from the release or dev tag, not $GITHUB_REF. Nothing was published."
              exit 1
              ;;
          esac
          TAG="${GITHUB_REF#refs/tags/}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The $TAG tag points at $GITHUB_SHA, which is not on main. Nothing was published."
            exit 1
          fi
          echo "The $TAG tag is on main ($GITHUB_SHA). Proceeding with build."
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: check-tag
    if: needs.check-tag.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare platform name
        run: echo "PLATFORM_PAIR=${MATRIX_PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=build-${{ env.PLATFORM_PAIR }},mode=max

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  build-and-push:
    name: Build & Push to Docker Hub
    needs: [check-tag, build]
    runs-on: ubuntu-latest
    permissions:
      # Needed to push the YYYYMMDDNN git tag for releases.
      contents: write
    env:
      IS_RELEASE: ${{ needs.check-tag.outputs.is_release }}
      IS_DEV_BUILD: ${{ github.ref == 'refs/tags/dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reserve date-based build version
        id: version
        if: env.IS_RELEASE == 'true'
        run: |
          # Version format: YYYYMMDDNN (UTC date + two-digit daily build number starting at 01).
          # Runs after both platform builds succeed, so a failed build never uses up a number.
          # The git tag is pushed before the image is tagged so concurrent runs can never claim the same number.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE=$(date -u +%Y%m%d)
          for attempt in $(seq 1 5); do
            git fetch --tags --force --quiet origin
            LAST=$(git tag -l "${DATE}[0-9][0-9]" | sort | tail -n 1)
            if [ -z "$LAST" ]; then
              NEXT=1
            else
              NEXT=$((10#${LAST:8:2} + 1))
            fi
            if [ "$NEXT" -gt 99 ]; then
              echo "::error::Daily build limit (99) reached for ${DATE}"
              exit 1
            fi
            VERSION=$(printf '%s%02d' "$DATE" "$NEXT")
            git tag -a "$VERSION" -m "Build $VERSION" "$GITHUB_SHA"
            if git push origin "refs/tags/$VERSION"; then
              echo "Reserved build version $VERSION"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tag $VERSION already taken, retrying..."
            git tag -d "$VERSION"
          done
          echo "::error::Could not reserve a build version after 5 attempts"
          exit 1

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # :latest is only ever set by the explicit release rule below.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ env.IS_RELEASE == 'true' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=raw,value=dev,enable=${{ env.IS_DEV_BUILD == 'true' }}

      - name: Create multi-arch manifest and push tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}"
